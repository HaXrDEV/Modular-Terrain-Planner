name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these first and only builds if they pass.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs, since a moved tag could run anything
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny,cargo-machete

      - name: Advisories, licences and sources
        run: cargo deny check

      - name: Unused dependencies
        run: cargo machete

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest

      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=pass

      - name: Doc tests
        run: cargo test --workspace --locked --doc

  # Renders real frames on each platform's GPU stack: lavapipe (Vulkan) and
  # llvmpipe (OpenGL) on Linux, WARP on Windows, Metal on macOS. A shader that
  # doesn't compile on a backend fails here, not on users' machines.
  gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: vulkan
          - os: ubuntu-24.04
            backend: gl
          - os: windows-2025
            backend: dx12
          - os: macos-15
            backend: metal
    runs-on: ${{ matrix.os }}
    env:
      MTP_REQUIRE_GPU: 1
      MTP_SOFTWARE_GPU: ${{ matrix.backend == 'metal' && '0' || '1' }}
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Render tests
        run: cargo test -p mtp-render --locked --test headless -- --nocapture

  # The oldest Rust the workspace says it builds with (rust-version in Cargo.toml)
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo +1.95 check --workspace --all-targets --locked
