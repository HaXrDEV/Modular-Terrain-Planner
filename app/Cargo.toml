[package]
name = "modular-terrain-planner"
description = "Plan modular terrain from your STL tiles, then print exactly what the layout needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "modular-terrain-planner"

[dependencies]
mtp-core.workspace = true
mtp-export.workspace = true
mtp-render.workspace = true
mtp-stl.workspace = true
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wayland", "wgpu", "x11"] }
egui_dock = "=0.21.1"
glam.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
