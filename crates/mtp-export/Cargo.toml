[package]
name = "mtp-export"
description = "Build plan exports of Modular Terrain Planner: print list, CSV, PNG map and PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mtp_export"

[dependencies]
mtp-core.workspace = true
thiserror.workspace = true
ab_glyph = "0.2.32"
csv = "1.4"
krilla = { version = "0.8.2", default-features = false }
png = "0.18.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
lopdf = "0.45"
tempfile.workspace = true

[lints]
workspace = true
